name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  check-release:
    name: Check for new version
    # taffy's self-hosted pool. No fork guard needed: this workflow has no
    # pull_request trigger, so only pushes to main and manual dispatch reach it.
    # Escape hatch: set the CI_FALLBACK repo variable to 'true'.
    runs-on: >-
      ${{ vars.CI_FALLBACK == 'true'
      && 'ubuntu-latest'
      || fromJSON('["self-hosted", "linux", "x64", "taffy"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      needs_github_release: ${{ steps.check.outputs.needs_github_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check whether the fork's GitHub release already exists
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $LOCAL_VERSION"
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

          # Fork distributes via GitHub Releases only (no npm publish), so the
          # only question is whether this version's release already exists.
          TAG="v$LOCAL_VERSION"
          if gh release view "$TAG" &>/dev/null; then
            echo "GitHub release $TAG exists, nothing to build"
            echo "needs_github_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub release $TAG is missing, will build and create it"
            echo "needs_github_release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.name }}
    needs: check-release
    if: needs.check-release.outputs.needs_github_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Fork only ships the platforms it actually runs on: Linux servers /
      # containers (x64 + arm64) and the Apple-Silicon saint host. Dropping
      # musl, Windows, and macOS-x64 keeps the weekly build cheap (macOS
      # runners bill at 10x). Re-add an entry here to ship another platform.
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-gnu.2.28
            binary: agent-browser-linux-x64
            use_zigbuild: true
          - name: Linux ARM64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-gnu.2.28
            binary: agent-browser-linux-arm64
            use_zigbuild: true
          - name: macOS ARM64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            build_target: aarch64-apple-darwin
            binary: agent-browser-darwin-arm64
            use_zigbuild: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version
        run: pnpm run version:sync

      - name: Build dashboard
        run: pnpm --filter dashboard build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cross-compilation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu mingw-w64

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild --version 0.22.3 --locked

      - name: Configure Rust linkers
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"

          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build with zigbuild
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --manifest-path cli/Cargo.toml --target ${{ matrix.build_target }}

      - name: Build with cargo
        if: '!matrix.use_zigbuild'
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Copy binary
        run: |
          mkdir -p artifacts
          cp cli/target/${{ matrix.rust_target }}/release/agent-browser artifacts/${{ matrix.binary }}
          chmod +x artifacts/${{ matrix.binary }}

      - name: Verify Linux GNU glibc floor
        if: matrix.binary == 'agent-browser-linux-x64' || matrix.binary == 'agent-browser-linux-arm64'
        run: |
          set -euo pipefail
          if objdump -p artifacts/${{ matrix.binary }} | grep -E 'GLIBC_2\.([3-9][0-9]|29)'; then
            echo "ERROR: ${{ matrix.binary }} requires glibc newer than 2.28"
            exit 1
          fi
          objdump -p artifacts/${{ matrix.binary }} | sed -n '/Version References:/,$p'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: artifacts/${{ matrix.binary }}
          retention-days: 7

  github-release:
    name: Create GitHub Release
    needs: [check-release, build-binaries]
    if: >-
      needs.build-binaries.result == 'success' &&
      needs.check-release.outputs.needs_github_release == 'true'
    # taffy's self-hosted pool. No fork guard needed: this workflow has no
    # pull_request trigger. Escape hatch: set the CI_FALLBACK repo variable to
    # 'true'. (The cross-platform `build-binaries` matrix above stays hosted —
    # there are no macOS or Windows self-hosted runners.)
    runs-on: >-
      ${{ vars.CI_FALLBACK == 'true'
      && 'ubuntu-latest'
      || fromJSON('["self-hosted", "linux", "x64", "taffy"]') }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Move binaries to bin directory
        run: |
          mkdir -p bin
          find artifacts -type f -name 'agent-browser-*' -exec mv {} bin/ \;
          rm -rf artifacts
          chmod +x bin/agent-browser-* 2>/dev/null || true
          ls -la bin/

      - name: Verify binaries exist
        run: |
          BINARY_COUNT=$(ls bin/agent-browser-* 2>/dev/null | wc -l)
          if [ "$BINARY_COUNT" -lt 3 ]; then
            echo "Error: Expected 3 binaries, found $BINARY_COUNT"
            ls -la bin/
            exit 1
          fi
          echo "Found $BINARY_COUNT binaries"

      - name: Extract changelog entry
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > /tmp/release-notes.md

          LINES=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$LINES" -lt 2 ]; then
            echo "Error: No release notes found between <!-- release:start --> and <!-- release:end --> markers in CHANGELOG.md"
            exit 1
          fi
          echo "Extracted release notes for $VERSION ($LINES lines)"

      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TAG="v$VERSION"

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" bin/agent-browser-* --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              bin/agent-browser-*
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
